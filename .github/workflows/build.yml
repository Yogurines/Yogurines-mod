name: Build mod

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Prueba de arranque del servidor
        if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          (timeout 420 ./gradlew runServer --no-daemon > server.log 2>&1 || true) &
          for i in $(seq 1 80); do grep -q 'Done (' server.log && break; sleep 5; done
          sleep 15
          pkill -f 'net.minecraftforge' || true; pkill -f java || true
          grep -E 'Done \(|ERROR|Exception|yogurines' server.log | grep -v 'DEBUG' | head -80
          grep -q 'Done (' server.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: yogurines-jar
          path: build/libs/*.jar

      - name: Release (latest build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yogurines · build ${{ github.run_number }}
          body: |
            Versión automática del mod Yogurines para Minecraft 1.20.1 (Forge).
            Descarga el .jar de abajo y ponlo en la carpeta `mods` de tu instancia.
          files: build/libs/*.jar
          make_latest: true
